name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Publicar Blazor WebAssembly
        run: dotnet publish src/MyQuestion.Web/MyQuestion.Web.csproj -c Release -o release --nologo

      - name: Ajustar caminho para GitHub Pages
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          sed -i "s|<base href=\"/\" />|<base href=\"/${REPO}/\" />|" release/wwwroot/index.html
          cp release/wwwroot/index.html release/wwwroot/404.html
          touch release/wwwroot/.nojekyll

      - name: Enviar para a branch gh-pages
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          folder: release/wwwroot
          branch: gh-pages
          single-commit: true
