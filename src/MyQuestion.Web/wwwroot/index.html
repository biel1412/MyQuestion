<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Anexe o print da dúvida e encontre o regramento certo na Central de Regramento." />
    <title>MyQuestion · Central de Regramento</title>
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <script>
        // Aplica o tema salvo antes de desenhar a página.
        try { document.documentElement.dataset.theme = localStorage.getItem("myquestion-theme") || "dark"; } catch (e) { }
    </script>
</head>

<body>
    <div id="app">
        <div class="boot">
            <div class="boot-spinner"></div>
            <p>Carregando MyQuestion…</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        Ocorreu um erro inesperado.
        <a href="" class="reload">Recarregar</a>
        <a class="dismiss">✕</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
    <script src="js/capture.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
